<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage History | Minerva Bench Tracker</title>
    <link rel="icon" href="/static/MBRDI.png" type="image/png">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="/static/MBRDI.png" alt="MBRDI" class="header-logo">
            <div class="header-titles">
                <h1>Usage History</h1>
                <span class="header-subtitle">Mercedes-Benz Research &amp; Development India</span>
            </div>
        </div>
        <div class="header-right">
            <a href="/" class="btn btn-secondary">Dashboard</a>
        </div>
    </div>

    <div class="history-container">
        <div class="filters">
            <select id="filter-bench" onchange="fetchHistory()">
                <option value="">All Benches</option>
                <option value="1">Minerva Bench 1 &mdash; Vijayanagara</option>
                <option value="2">Minerva Bench 2 &mdash; Maurya</option>
                <option value="3">Minerva Bench 3 &mdash; Chola</option>
                <option value="4">Minerva Bench 4 &mdash; Magadha</option>
                <option value="5">Minerva Bench 5 &mdash; Pallava</option>
            </select>
            <input type="text" id="filter-user" placeholder="Search by Short ID..." onkeyup="fetchHistory()">
        </div>

        <table class="history-table">
            <thead>
                <tr>
                    <th>Bench</th>
                    <th>PC Type</th>
                    <th>User</th>
                    <th>Purpose</th>
                    <th>Access</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="8" class="no-data">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <div class="footer-content">
            <div class="footer-line"></div>
            <p class="footer-text">Mercedes-Benz Research &amp; Development India</p>
            <p class="footer-text">Minerva Bench Usage Automation &mdash; Internal Use Only</p>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", fetchHistory);
    </script>
</body>
</html>
