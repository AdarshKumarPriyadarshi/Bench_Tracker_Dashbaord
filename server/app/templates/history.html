<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage History | System Function Bench Tracker</title>
    <link rel="icon" href="/static/MBRDI.png" type="image/png">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="header">
        <div class="header-left" onclick="window.location='/'" style="cursor:pointer;">
            <img src="/static/MBRDI.png" alt="MBRDI" class="header-logo">
            <div class="header-titles">
                <h1>System Function Bench Tracker</h1>
                <span class="header-subtitle">Mercedes-Benz Research &amp; Development India</span>
            </div>
        </div>
        <div class="header-right">
            <a href="/" class="btn btn-secondary">Dashboard</a>
            <a href="/history" class="btn btn-active">History</a>
            <a href="/statistics" class="btn btn-secondary">Statistics</a>
            <a href="/defect-board" class="btn btn-secondary">Defect Board</a>
        </div>
    </div>

    <div class="history-container">
        <div class="filters">
            <select id="filter-bench" onchange="fetchHistory()">
                <option value="">All Benches</option>
                <option value="1">Vijayanagara</option>
                <option value="2">Maurya</option>
                <option value="3">Chola</option>
                <option value="4">Magadha</option>
                <option value="5">Pallava</option>
            </select>
            <input type="text" id="filter-user" placeholder="Search by Short ID..." onkeyup="fetchHistory()">
            <select id="filter-limit" onchange="fetchHistory()">
                <option value="50" selected>50 Records</option>
                <option value="100">100 Records</option>
                <option value="200">200 Records</option>
                <option value="500">500 Records</option>
            </select>
            <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
        </div>

        <table class="history-table">
            <thead>
                <tr>
                    <th>Bench</th>
                    <th>User</th>
                    <th>Purpose</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="6" class="no-data">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer" style="display:flex;justify-content:center;align-items:center;padding:1.2rem 2.5rem;border-top:1px solid var(--border-color);margin-top:1rem;background:#1a1a1a;">
        <p class="footer-text" style="color:var(--mercedes-silver);">&copy; 2026 Mercedes-Benz Research &amp; Development India. All Rights Reserved.</p>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", fetchHistory);
    </script>
</body>
</html>
