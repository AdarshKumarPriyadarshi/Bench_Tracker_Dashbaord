<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Function Bench Tracker | MBRDI</title>
    <link rel="icon" href="/static/MBRDI.png" type="image/png">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="header">
        <div class="header-left" onclick="window.location='/'" style="cursor:pointer;">
            <img src="/static/MBRDI.png" alt="MBRDI" class="header-logo">
            <div class="header-titles">
                <h1>System Function Bench Tracker</h1>
                <span class="header-subtitle">Mercedes-Benz Research &amp; Development India</span>
            </div>
        </div>
        <div class="header-right">
            <span class="live-indicator">
                <span class="live-dot"></span>
                Live
                <span id="last-updated" style="margin-left:0.6rem;font-size:0.55rem;color:var(--text-muted);letter-spacing:0.04em;"></span>
            </span>
            <a href="/history" class="btn btn-secondary">History</a>
            <a href="/statistics" class="btn btn-secondary">Statistics</a>
            <a href="/defect-board" class="btn btn-secondary">Defect Board</a>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value green" id="stat-available">&mdash;</span>
            <span class="stat-label">Available</span>
        </div>
        <div class="stat-item">
            <span class="stat-value red" id="stat-occupied">&mdash;</span>
            <span class="stat-label">Occupied</span>
        </div>
        <div class="stat-item">
            <span class="stat-value blue" id="stat-users">&mdash;</span>
            <span class="stat-label">Active Users</span>
        </div>
        <div class="stat-item">
            <span class="stat-value silver" id="stat-total">5</span>
            <span class="stat-label">Total Benches</span>
        </div>
    </div>

    <div class="bench-grid" id="bench-grid"></div>

    <div class="footer" style="display:flex;justify-content:center;align-items:center;padding:1.2rem 2.5rem;border-top:1px solid var(--border-color);margin-top:1rem;background:#1a1a1a;">
        <p class="footer-text" style="color:var(--mercedes-silver);">&copy; 2026 Mercedes-Benz Research &amp; Development India. All Rights Reserved.</p>
    </div>

    <div id="toast-container"></div>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
